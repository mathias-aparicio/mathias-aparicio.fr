<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">

        <!-- Include Spline Sans and Spline Sans Mono -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@400;700&family=Spline+Sans+Mono:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">

        <!-- Include SCSS stylesheet -->
        <link rel="stylesheet" href="{{ get_url(path="styles.css") }}">

        <!-- Include Font Awesome 7.1.0  -->
        <link rel="stylesheet"
              href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.1.0/css/all.min.css">

        <title>Mathias Blog</title>
    </head>
    <body>
        <nav>
            <li>
                <a href="/">
                    <i class="fa-regular fa-house"></i>
                    About
                </a>
            </li>
            <li>
                <a href="/blog">
                    <i class="fa-regular fa-pen-to-square"></i>
                    Blog
                </a>
            </li>
            <li>
                <a href="https://github.com/mathias-aparicio">
                    <i class="fa-brands fa-github"></i>
                    Github
                </a>
            </li>
            <li>
                <a href="https://www.linkedin.com/in/mathias-aparicio/?originalSubdomain=fr">
                    <i class="fa-brands fa-linkedin-in"></i>
                    Linkedin
                </a>
            </li>
        </nav>
        <section class="section">
            <div class="container">
                {% block content %}
                {% endblock content %}
            </div>
        </section>
    </body>
</html>
